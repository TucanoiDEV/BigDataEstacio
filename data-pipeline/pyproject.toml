[project]
name = "emprego-pipeline"
version = "0.1.0"
description = "Pipeline de ingestão de dados oficiais (Novo CAGED, RAIS, IBGE) do Emprego Agora"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.30",
  "py7zr>=0.22",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Expansão futura para volumes maiores (RAIS completa, séries históricas longas):
spark = ["pyspark>=3.5"]

[project.scripts]
emprego-pipeline = "emprego_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
