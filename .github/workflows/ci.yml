name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: emprego
          POSTGRES_PASSWORD: emprego_ci
          POSTGRES_DB: emprego_agora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emprego" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://emprego:emprego_ci@localhost:5432/emprego_agora_test?schema=public
      TEST_DATABASE_URL: postgresql://emprego:emprego_ci@localhost:5432/emprego_agora_test?schema=public
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
      HASH_PEPPER: ${{ secrets.CI_HASH_PEPPER || 'AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q
